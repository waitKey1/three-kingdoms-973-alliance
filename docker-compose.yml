services:
  postgres:
    image: postgres:16-bookworm
    container_name: alliance973-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alliance973
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - alliance973_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alliance973"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-bookworm
    container_name: alliance973-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:63800:6379"
    volumes:
      - alliance973_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: three-kingdoms-973-alliance-v2
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      APP_URL: https://973.sligenai.cn
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/alliance973?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:18121:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  alliance973_postgres:
  alliance973_redis:
